{% extends 'base.html' %}

{% block content %}

    {% if user.is_authenticated %}
        <div class="flex justify-center items-center">
            <div class="bg-white p-6 rounded-lg w-full lg:w-3/4">
                <h1 class="text-4xl">Início</h1>
            </div>
        </div>
        <div class="md:flex md:overflow-x-auto md:flex-row gap-2">
              <div class="stat bg-gray-100 border black shadow rounded text-center">
                <div class="stat-title">Downloads</div>
                <div class="stat-value">31K</div>
                <div class="stat-desc">Jan 1st - Feb 1st</div>
              </div>
              <div class="stat bg-gray-100 border black shadow rounded text-center">
                <div class="stat-title">New Users</div>
                <div class="stat-value">4,200</div>
                <div class="stat-desc">↗︎ 400 (22%)</div>
              </div>
              <div class="stat bg-gray-100 border black shadow rounded text-center">
                <div class="stat-title">New Registers</div>
                <div class="stat-value">1,200</div>
                <div class="stat-desc">↘︎ 90 (14%)</div>
              </div>
        </div>
        <div class="md:flex md:overflow-x-auto md:flex-row gap-4 mt-10 ">
            <div class="md:flex md:w-1/3 bg-gray-100 h-96 rounded shadow">
                {{ chart_html|safe }}
            </div>
            <div class="md:flex md:w-1/3 bg-gray-100 h-96 rounded shadow ">
                Teste
            </div>
            <div class="md:flex md:w-1/3 bg-gray-100 h-96 rounded shadow ">
                Teste
            </div>
        </div>
    {% endif %}
{% endblock %}
